name: Build

# Every push to main builds the exe. If the <Version> in the .csproj has no
# GitHub Release yet, the build is published as release v<Version>, which the
# app's auto-updater picks up. To ship an update: bump <Version> and push.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Read version
        shell: bash
        run: |
          VERSION=$(grep -oP '(?<=<Version>)[^<]+' src/RobloxAccountManager/RobloxAccountManager.csproj)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          if gh release view "v$VERSION" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "NEW_RELEASE=false" >> $GITHUB_ENV; else echo "NEW_RELEASE=true" >> $GITHUB_ENV; fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Publish single-file exe
        run: >
          dotnet publish src/RobloxAccountManager/RobloxAccountManager.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o publish

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: RobloxAccountManager-win-x64
          path: publish/RobloxAccountManager.exe

      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.NEW_RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          files: publish/RobloxAccountManager.exe
          generate_release_notes: true
